<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赤月软件库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        body {
            min-height: 100vh;
            background: #050118;
            background-image: 
                linear-gradient(rgba(18, 4, 35, 0.85), rgba(5, 1, 24, 0.95)),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0, 255, 255, 0.08) 2px, rgba(0, 255, 255, 0.08) 4px),
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255, 0, 128, 0.08) 2px, rgba(255, 0, 128, 0.08) 4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 霓虹标题 */
        .title {
            font-size: 48px;
            font-weight: bold;
            color: #ffffff;
            text-shadow:
                0 0 4px #fff,
                0 0 10px #0ff,
                0 0 20px #0ff,
                0 0 40px #0088ff;
            letter-spacing: 8px;
            margin-bottom: 80px;
            animation: flicker 3s infinite alternate;
        }

        @keyframes flicker {
            0% {opacity: 0.95;}
            100% {opacity: 1;}
        }

        /* 赛博按钮 */
        .download-btn {
            padding: 16px 60px;
            font-size: 22px;
            letter-spacing: 3px;
            background: transparent;
            border: 2px solid #ff0080;
            color: #ff4499;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 0, 128, 0.4);
        }

        .download-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 128, 0.1);
            z-index: -1;
        }

        .download-btn:hover {
            background: rgba(255, 0, 128, 0.2);
            box-shadow: 0 0 25px rgba(255, 0, 128, 0.7);
            color: #fff;
        }

        /* 扫描线 */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                transparent 0px,
                rgba(0,0,0,0.06) 1px,
                transparent 3px
            );
        }
    </style>
</head>
<body>
    <div class="scanline"></div>

    <h1 class="title">赤月软件库</h1>

    <!-- href留空，后续填链接即可 -->
    <a href="" class="download-btn">前往下载地址</a>

</body>
</html>
